[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task-parameterized-eto-evaluation"
version = "0.0.0"
authors = []
description = "task-parameterized-eto-evaluation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch >= 2.6.0, < 2.13.0",
  "numpy >= 2.0.0",
  "scipy >= 1.15.0",
  "evox >= 1.2.1",
  "tensordict >= 0.12.0, < 0.14.0",
  "tqdm",
]

[project.optional-dependencies]
vis = [
  "plotly >= 5.0.0",
  "pandas >= 2.0.0",
  "matplotlib >= 3.10.0",
]

[tool.ruff]
# Allow lines to be as long as 128. (default: 88)
line-length = 128
# Use `\n` line endings for all files
format.line-ending = "lf"
# F: Pyflakes / E, W: pycodestyle / I: isort / NPY: numpy
lint.select = ["F", "E", "W", "I", "NPY"]
lint.ignore = ["E501"] # Ignore line length error
lint.per-file-ignores = {"*.ipynb" = ["I001"]}
